name: Export Spotify Mirror Metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotify-liked-songs-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Export mirror metadata
        run: npm run export:mirror -- --output export/mirror-playlist.json
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

      - name: Upload temporary export
        uses: actions/upload-artifact@v4
        with:
          name: mirror-playlist-metadata
          path: export/mirror-playlist.json
          if-no-files-found: error
          retention-days: 1
